<title>Deadzone Idle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
/* ==========================================================================
   Deadzone - one dark world, deliberately single-theme.
   The page is a game viewport: it paints its own ground and never borrows
   the host's, in either light or dark.
   ========================================================================== */
:root{
  color-scheme: dark;

  --void:#05070A;
  --ash:#0A0E12;
  --slab:#11161B;
  --raise:#182027;
  --line:rgba(228,224,214,.12);
  --line-soft:rgba(228,224,214,.06);

  --bone:#E4E0D6;
  --smoke:#8A939B;
  --dim:#59636C;

  --rust:#D2562A;
  --rust-dk:#8E3517;
  --moss:#7FA45C;
  --amber:#E3A63F;
  --ice:#6FA8C4;

  /* ---- the instrument blue ----
     Panels are a cold slate and everything live on them is one blue,
     which is what ties a HUD together: the same colour on the active
     tab, the selected weapon, the fire ring and the XP bar says "this
     is the part that is yours" every time it appears. */
  --hud-bg:#0D141C;
  --hud-bg2:#141E29;
  --hud-line:rgba(126,164,196,.20);
  --hud-line2:rgba(126,164,196,.10);
  --blue:#4EA8E8;
  --blue-dk:#1F5C8C;
  --blue-glow:rgba(78,168,232,.34);
  --hp:#5FC45A;
  --xp:#3E9BE0;

  --f-disp:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow","Helvetica Neue",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;

  --sa-t:env(safe-area-inset-top,0px);
  --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px);
  --sa-r:env(safe-area-inset-right,0px);

  --hud-h:84px;    /* how far down the top instruments reach */
  /* Everything down the left edge is this wide. It used to be four
     different widths - 205, 250, 132, 132 - stacked on the same margin,
     which is why the side of the screen looked like a pile rather than a
     panel. One column, one edge, top to bottom. */
  /* The reference runs its cards at about a fifth of the screen, and a
     card carrying a portrait, a level, two labelled bars and their
     figures genuinely needs that - at 168 the bars came out 64px wide
     and the weapon name was "M...". */
  --col:222px;
  --rail-w:54px;   /* a command-rail button */
  /* How far in from the right edge anything must start to clear the rail:
     the rail is a slab now, so its button width is no longer the whole of
     it - there is its own padding and border either side, and a gap. */
  --rail-out:calc(var(--rail-w) + 34px);
  --mm:168px;      /* the minimap square - matches --col */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Nothing here is prose. A drag across the world used to start a text
   selection, which highlights half the HUD and eats the drag; a long
   press on a phone raised the copy callout over whatever was underneath.
   Set on the root as well as the body, because the selection can start
   on the page outside the body box. */
/* The page is a fixed pane, not a document.

   Both elements, because either one left scrollable is enough to let a
   phone drag the whole game up off the top of the screen and leave a
   white band under it. `overscroll-behavior` kills the rubber band even
   where there is nothing to scroll to, and `100dvh` tracks the browser
   chrome sliding in and out rather than leaving a gap where it was. */
html,body{position:fixed;inset:0;width:100%;height:100%;height:100dvh;
  margin:0;padding:0;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;
  user-select:none;-webkit-touch-callout:none}
body{
  position:fixed;inset:0;overflow:hidden;
  background:var(--void);color:var(--bone);
  font-family:var(--f-body);font-size:15px;line-height:1.45;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h3,h4{margin:0}

#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;
  cursor:crosshair}
body.building #scene{cursor:cell}

/* ============================ HUD ======================================== */
#hud{
  position:absolute;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding:calc(var(--sa-t) + 10px) calc(var(--sa-r) + 12px) 0 calc(var(--sa-l) + 12px);
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  gap:10px;align-items:start;
}
#hud button,#hud .pl,#hud .res{pointer-events:auto}

/* Instrument slab - the one surface every HUD cluster is made from.

   A hairline of light along the top edge and a darker one along the
   bottom is the whole difference between a translucent rectangle and a
   panel milled out of something. It is the same trick the world art
   uses on every box, applied to the furniture. */
.inst{
  position:relative;
  background:
    linear-gradient(180deg,rgba(228,224,214,.05),rgba(228,224,214,0) 38%),
    linear-gradient(180deg,rgba(19,25,31,.93),rgba(7,10,14,.95));
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px) saturate(.88);backdrop-filter:blur(14px) saturate(.88);
  box-shadow:0 8px 28px rgba(0,0,0,.58),
             inset 0 1px 0 rgba(228,224,214,.09),
             inset 0 -1px 0 rgba(0,0,0,.5);
}

.hcol.l{display:flex;align-items:flex-start;min-width:0}

/* ---- survivor ----
   Portrait, then a column with the two bars that matter. It used to run
   205px wide with the health floating off to the right of its own track
   and the weapon on a line of its own, so three facts took the room of
   six. */
#sv{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 7px;border-radius:12px;
  pointer-events:auto;text-align:left;width:var(--col)}
#sv:active{transform:translateY(1px)}

/* A round portrait with the level worn on it, the way the reference has it.
   The XP ring is a conic gradient rather than a bar, so the badge carries
   both numbers without a second widget. */
.svmark{position:relative;width:46px;height:46px;flex:none;border-radius:50%;
  display:grid;place-items:center}
.svmark i{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--amber) var(--xpdeg,0deg),rgba(228,224,214,.13) 0)}
.svmark i em{display:none}
.svmark::before{content:"";position:absolute;inset:3px;border-radius:50%;
  background:linear-gradient(165deg,#44544A,#1C2622);
  border:1px solid rgba(228,224,214,.2);
  box-shadow:inset 0 2px 7px rgba(0,0,0,.45)}
/* the survivor's own face, painted once into this canvas */
#svFace{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);
  border-radius:50%;display:block}
.svmark b{position:absolute;right:-2px;bottom:-2px;min-width:19px;height:19px;padding:0 4px;
  border-radius:11px;display:grid;place-items:center;
  font-family:var(--f-disp);font-weight:700;font-size:13px;line-height:1;
  color:#120D04;background:linear-gradient(180deg,#F0BC58,#D08F26);
  border:1.5px solid rgba(5,7,10,.85);
  font-variant-numeric:tabular-nums}
.svcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
/* the figure sits ON the bar, not beside it - a number in its own column
   was costing 34px of a 184px card to say what the bar already showed */
.hprow{position:relative;display:block}
.hptrack{position:relative;height:15px;border-radius:4px;background:rgba(0,0,0,.66);
  border:1px solid var(--line-soft);overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.55)}
.hptrack>i{position:absolute;inset:0;transform-origin:left;background:var(--moss);
  transition:transform .14s linear,background .3s}
/* Static, not absolute. This was pinned to the top-right of the card in
   the layout before the bars were a grid; left absolute it never joined
   the grid, so the figure column measured zero and the number floated a
   row and a half above the bar it belongs to. An ID beats any class
   override, so it has to be corrected here rather than layered over. */
#svHpNum{position:static;line-height:15px;
  font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:#F2EEE2;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.75);
  pointer-events:none}
.wrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
#svWpn{font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.06em;
  color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#svAmmo{font-family:var(--f-mono);font-size:11px;color:var(--smoke);
  font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
#svAmmo.lo{color:var(--rust)}
#svAmmo.rel{color:var(--amber)}

/* ---- world ---- */
#worldChip{display:flex;align-items:center;gap:11px;padding:8px 16px;border-radius:14px;
  justify-self:center;flex:none;z-index:1}
#wcOrb{width:15px;height:15px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 34% 30%,#FFE7A8,#E0A33C)}
.wctext{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
#wcDay{font-family:var(--f-disp);font-weight:700;font-size:16px;letter-spacing:.07em;
  text-transform:uppercase}
#wcTime{font-family:var(--f-mono);font-size:14px;color:var(--bone);
  font-variant-numeric:tabular-nums}
#wcPhase{font-family:var(--f-disp);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim)}
/* which part of town you are standing in. The city has a dozen districts
   and they are the whole navigation system, so the HUD has to say. */
#wcZone{font-family:var(--f-disp);font-size:11.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--smoke);padding-left:9px;margin-left:1px;
  border-left:1px solid var(--line-soft)}
#wcZone.hot{color:#D2562A}
#threat{display:none;align-items:center;gap:7px;margin-left:2px;padding:3px 10px 3px 8px;
  border-radius:9px;background:rgba(228,224,214,.06);border:1px solid var(--line-soft)}
#threat.on{display:flex}
#threat.hot{background:rgba(210,86,42,.14);border-color:rgba(210,86,42,.42)}
#threat .dot{width:6px;height:6px;border-radius:50%;background:var(--smoke)}
#threat.hot .dot{background:var(--rust);animation:pulse 1.1s ease-in-out infinite}
#threatN{font-family:var(--f-mono);font-size:11.5px;color:var(--smoke);white-space:nowrap}
#threat.hot #threatN{color:var(--rust)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}

/* ---- resources ---- */
/* Separate capsules rather than one welded strip, each with the + that says
   where more of it comes from. */
.rcol{display:flex;justify-content:flex-end;align-items:flex-start;gap:7px;flex-wrap:wrap}
/* One instrument with four cells in it, not four instruments.
   Labelling each capsule was the right call and made each of them wide
   enough that four would not fit the corner - so they lose their own
   borders, padding and gaps and share one slab, which buys back the
   ~90px the labels needed and matches the command rail besides. */
/* One slab of cells. It scrolls rather than clipping, because a counter
   you cannot see is worse than a counter you have to nudge - and on a
   phone in portrait there is genuinely not room for four of them with
   their names on. */
#resRow{display:flex;align-items:stretch;gap:0;padding:4px;border-radius:13px;
  max-width:100%;overflow-x:auto;overscroll-behavior:contain;
  scrollbar-width:none}
#resRow::-webkit-scrollbar{display:none}
#resRow .res{flex:0 0 auto}
/* A cell says four things: which resource, how much, how close to the
   cap, and - by being a button - where more of it comes from. It used to
   say the second of those and leave you to recognise the other three
   from a 12px mark. */
#resRow .res{position:relative;display:flex;align-items:center;gap:7px;
  padding:5px 11px 6px;border-radius:8px;overflow:hidden;text-align:left;
  transition:background .13s}
#resRow .res + .res::before,#resRow .more::before{content:"";position:absolute;
  left:0;top:6px;bottom:6px;width:1px;background:var(--line-soft)}
#resRow .res:hover{background:rgba(228,224,214,.07)}
#resRow .res:active{transform:translateY(1px)}
svg.gi{vertical-align:-1px;flex:none;opacity:.9}
#resRow .res .rmk{width:23px;height:23px;flex:none;border-radius:7px;display:grid;
  place-items:center;background:rgba(228,224,214,.08);
  box-shadow:inset 0 1px 0 rgba(228,224,214,.07)}
#resRow .res .rmk svg.gi{opacity:1}
#resRow .res .rtx{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  line-height:1;min-width:0}
#resRow .res .rtx s{text-decoration:none;font-family:var(--f-disp);font-size:8.5px;
  font-weight:600;letter-spacing:.19em;text-transform:uppercase;color:var(--dim)}
#resRow .res b{font-family:var(--f-mono);font-size:14px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--bone);letter-spacing:-.01em}
/* the hairline is the cap: full means what you carry home is wasted */
#resRow .res .rfill{position:absolute;left:8px;right:8px;bottom:2px;height:2.5px;
  border-radius:2px;background:rgba(0,0,0,.4);pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(228,224,214,.05)}
#resRow .res .rfill i{display:block;height:100%;border-radius:2px;
  transform:scaleX(0);transform-origin:left;
  background:var(--moss);transition:transform .3s,background .3s}
#resRow .res.nocap .rfill{display:none}
#resRow .res.full .rfill i{background:var(--amber)}
#resRow .res.full b{color:var(--amber)}
#resRow .res.bad b{color:var(--rust)}
#resRow .res.bad .rfill i{background:var(--rust)}
/* a counter that just went up */
#resRow .res.pop{animation:resPop .5s cubic-bezier(.2,.9,.3,1)}
#resRow .res.pop .rmk{animation:markPop .5s cubic-bezier(.2,.9,.3,1)}
@keyframes resPop{
  0%{background:rgba(227,166,63,.34)}
  100%{background:rgba(227,166,63,0)}
}
@keyframes markPop{
  0%{transform:scale(1)}
  32%{transform:scale(1.26)}
  100%{transform:scale(1)}
}
@media (prefers-reduced-motion:reduce){
  #resRow .res.pop,#resRow .res.pop .rmk{animation:none}
}
#resRow .more{position:relative;padding:5px 12px;border-radius:8px;color:var(--dim);
  font-size:15px;line-height:1;pointer-events:auto;align-self:stretch;
  display:grid;place-items:center;transition:color .13s,background .13s}
#resRow .more:hover{color:var(--bone);background:rgba(228,224,214,.07)}

/* ============================ objectives ================================= *
   Two or three cards under the portrait saying what the compound wants next.
   They are the only thing on screen that tells you what to do, so they earn
   the corner; anything longer belongs in the Tasks sheet.
   ========================================================================= */
#quests{position:absolute;z-index:5;
  top:calc(var(--sa-t) + var(--hud-h) + 12px);left:calc(var(--sa-l) + 12px);
  display:flex;flex-direction:column;gap:4px;pointer-events:auto;
  width:var(--col)}
.qcard{position:relative;display:flex;align-items:center;gap:8px;padding:6px 9px;
  border-radius:9px;text-align:left;overflow:hidden;
  background:linear-gradient(180deg,rgba(18,24,30,.88),rgba(7,10,14,.9));
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 5px 18px rgba(0,0,0,.45)}
.qcard:hover{border-color:rgba(228,224,214,.28)}
.qcard .qi{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;
  background:rgba(227,166,63,.12);color:var(--amber)}
.qcard .qi svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.qcard .qt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.qcard .qt b{font-family:var(--f-disp);font-size:11.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--bone);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.qcard .qbar{height:3px;border-radius:2px;background:rgba(0,0,0,.55);overflow:hidden}
.qcard .qbar i{display:block;height:100%;background:var(--amber);transform-origin:left;
  border-radius:3px;transition:transform .3s}
.qcard s{text-decoration:none;font-family:var(--f-mono);font-size:9.5px;color:var(--smoke);
  font-variant-numeric:tabular-nums;flex:none}
.qcard.done{border-color:rgba(127,164,92,.5)}
.qcard.done .qi{background:rgba(127,164,92,.16);color:var(--moss)}
.qcard.done .qbar i{background:var(--moss)}

@media (max-width:1060px){
  #wcPhase{display:none}
  #sv{max-width:252px}
}
@media (max-width:900px){
  :root{--hud-h:128px}
  #hud{grid-template-columns:minmax(0,1fr) auto;row-gap:7px}
  #worldChip{grid-column:2;grid-row:1;justify-self:end}
  .rcol{grid-column:1 / -1;grid-row:2;justify-content:flex-end}
  /* the name goes before the figure does */
  #resRow .res{padding:5px 9px 6px;gap:6px}
  #resRow .res .rtx s{display:none}
  #resRow .res b{font-size:13px}
}
@media (max-width:700px){
  #wcZone{display:none}
  #resRow .res .rmk{width:20px;height:20px;border-radius:6px}
}
@media (max-width:560px){
  :root{--hud-h:124px}
  #sv{max-width:none;padding:6px 11px 6px 6px;gap:8px}
  .svmark{width:42px;height:42px}
  .svmark b{min-width:18px;height:18px;font-size:11.5px}
  #threat{display:none}
  #worldChip{padding:6px 11px;gap:7px}
  #wcDay{font-size:13.5px}
  #wcTime{font-size:12px}
  #wcPhase{display:none}
  #resRow{padding:3px}
  #resRow .res{padding:4px 8px 5px}
  #resRow .res b{font-size:12.5px}
}

/* ============================ mode chip ================================== */
/* What is in your hands sits with the hotbar, not with the world clock -
   and it keeps clear of the toast column at the top of the screen. */
#modeChip{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--sa-b) + 18px);z-index:8;
  display:none;align-items:center;gap:10px;
  padding:7px 9px 7px 15px;border-radius:12px;border:1px solid rgba(210,86,42,.4)}
#modeChip.on{display:flex}
#modeText{font-family:var(--f-disp);font-size:12.5px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--amber)}
/* Touch has no R key, so the turn lives on the chip that says what is on
   the cursor - which is also where a keyboard player looks to find it. */
#modeRot{display:flex;align-items:center;gap:5px;padding:4px 9px;
  border:1px solid rgba(227,166,63,.42);border-radius:7px;color:var(--amber)}
#modeRot svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
#modeRot b{font-family:var(--f-mono);font-size:10px;font-weight:500;opacity:.75}
#modeRot:hover{background:rgba(227,166,63,.14)}
#modeRot:active{transform:translateY(1px)}
#modeRot.gone{display:none}
#modeCancel{padding:4px 10px;border:1px solid var(--line);border-radius:7px;
  font-family:var(--f-mono);font-size:10.5px;color:var(--smoke)}
#modeCancel:hover{color:var(--bone);border-color:var(--bone)}

/* ============================ side controls ============================== */
#recenter{position:absolute;right:calc(var(--sa-r) + var(--rail-out));
  bottom:calc(var(--sa-b) + 112px);z-index:6;
  display:none;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;
  background:rgba(10,14,18,.9);border:1px solid var(--line);
  font-family:var(--f-disp);font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--smoke)}
#recenter.on{display:flex}
#recenter:hover{color:var(--bone);border-color:var(--bone)}

/* Two thumb pads, only where there is no keyboard: left walks, right aims
   and fires. They write the same axis the keys do. */
.pad{position:absolute;z-index:6;width:104px;height:104px;border-radius:50%;
  display:none;touch-action:none;place-items:center;
  background:radial-gradient(circle at 50% 50%,rgba(16,22,28,.75),rgba(8,11,14,.6));
  border:1px solid var(--line)}
.pad i{width:40px;height:40px;border-radius:50%;background:rgba(228,224,214,.14);
  border:1px solid var(--line);display:block;transition:transform .05s linear}
/* ---- abilities ----

   Two things you can do that are not pulling a trigger, so they get
   their own controls rather than hiding on a keyboard. They are on
   screen with a mouse too, because the button IS the cooldown readout.

   An earlier pass made them discs with a ring draining round the rim.
   Two problems with that, both fatal. The ring was the loudest thing on
   the screen and read as a loading spinner rather than a control, and a
   number counting down in the middle of the face covered the one thing
   that says which button you are looking at.

   So: a cell that charges. The tile fills from the bottom as the
   cooldown burns off and sits full and amber when it is ready, which is
   the same language as every other gauge here - and it never covers the
   icon, because the icon is what you are aiming at with your thumb.
   Rounded tiles rather than circles, in one slab, because that is what
   the rest of this HUD is made of. */
#acts{position:absolute;z-index:6;
  right:calc(var(--sa-r) + var(--rail-out));bottom:calc(var(--sa-b) + 186px);
  display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:15px}

.act{position:relative;width:64px;height:64px;border-radius:11px;
  padding:0;border:1px solid var(--line);overflow:hidden;pointer-events:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,rgba(24,31,38,.8),rgba(9,13,17,.86));
  box-shadow:inset 0 1px 0 rgba(228,224,214,.07);
  color:var(--smoke);
  transition:border-color .16s,box-shadow .16s,transform .08s}

/* the charge, rising from the bottom of the cell */
.act .afill{position:absolute;left:0;right:0;bottom:0;height:var(--fill,0%);
  pointer-events:none;
  background:linear-gradient(180deg,rgba(227,166,63,.26),rgba(227,166,63,.10));
  border-top:1px solid rgba(227,166,63,.5);
  transition:height .09s linear}

.act .aico{position:relative;display:grid;place-items:center;
  width:34px;height:34px;margin-top:2px}
.act .aico svg{width:31px;height:31px;fill:currentColor;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.75));
  transition:color .16s,transform .12s}
.act b{position:relative;font-family:var(--f-disp);font-size:8.5px;font-weight:700;
  letter-spacing:.2em;color:var(--dim);transition:color .16s}

/* the key, notched into the top corner rather than floating beside it */
.act .akey{position:absolute;top:0;left:0;font-style:normal;
  min-width:15px;height:14px;padding:0 4px;
  border-radius:11px 0 8px 0;
  display:grid;place-items:center;
  font-family:var(--f-mono);font-size:9px;line-height:1;
  color:var(--smoke);background:rgba(228,224,214,.13)}

/* the seconds, in the corner where they cover nothing */
.act .acd{position:absolute;top:1px;right:4px;display:none;
  text-decoration:none;font-family:var(--f-mono);font-size:12.5px;
  color:#F2EEE2;text-shadow:0 1px 3px rgba(0,0,0,.9);
  font-variant-numeric:tabular-nums}

/* ---- states ---- */
.act.ready{border-color:rgba(227,166,63,.5);
  box-shadow:inset 0 1px 0 rgba(228,224,214,.1),0 0 12px rgba(227,166,63,.16)}
.act.ready .aico svg{color:var(--amber)}
.act.ready b{color:var(--bone)}

.act.cooling .afill{
  background:linear-gradient(180deg,rgba(150,166,182,.18),rgba(150,166,182,.07));
  border-top-color:rgba(168,182,196,.42)}
/* Dimmed, but still legible. A cooling ability you cannot identify is
   no better than one you cannot see at all - the point of not covering
   the icon was that the icon stays readable. */
.act.cooling .aico svg{color:rgba(228,224,214,.46)}
.act.cooling b{color:rgba(228,224,214,.3)}
.act.cooling .acd{display:block}
.act.cooling .akey{opacity:.3}

/* the moment it comes back: one sweep of light across the face */
.act.charge::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,rgba(255,236,190,0) 30%,
             rgba(255,236,190,.55) 50%,rgba(255,236,190,0) 70%);
  transform:translateX(-100%);
  animation:actSweep .42s cubic-bezier(.3,0,.2,1)}
@keyframes actSweep{to{transform:translateX(100%)}}

/* armed: the throw is waiting on you to let go */
.act.armed{border-color:var(--rust);
  box-shadow:inset 0 1px 0 rgba(228,224,214,.1),0 0 0 1px rgba(210,86,42,.4),
             0 0 16px rgba(210,86,42,.34)}
.act.armed .afill{
  background:linear-gradient(180deg,rgba(210,86,42,.32),rgba(210,86,42,.12));
  border-top-color:rgba(232,120,74,.7)}
.act.armed .aico svg{color:#FFC49E;animation:actArm .66s ease-in-out infinite}
.act.armed b{color:#F0A882}
@keyframes actArm{50%{transform:translateY(-2px) scale(1.06)}}

.act:active{transform:translateY(1px);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}

body.basemode #acts,body.indoors #acts{display:none}
@media (max-width:900px){
  #acts{bottom:calc(var(--sa-b) + 214px)}
  .act{width:72px;height:72px}
  .act .aico{width:38px;height:38px}
  .act .aico svg{width:35px;height:35px}
  .act .acd{font-size:14px}
}
@media (max-width:560px){
  .act{width:66px;height:66px}
  .act .aico svg{width:31px;height:31px}
}
@media (prefers-reduced-motion:reduce){
  .act.charge::after,.act.armed .aico svg{animation:none}
  .act .afill{transition:none}
}

#movepad{left:calc(var(--sa-l) + 18px);bottom:calc(var(--sa-b) + var(--mm) + 30px)}
#movepad.on{border-color:var(--bone);
  background:radial-gradient(circle at 50% 50%,rgba(34,40,46,.7),rgba(8,11,14,.7))}
#movepad.on i{background:rgba(228,224,214,.34);border-color:var(--bone)}
#aimpad{right:calc(var(--sa-r) + var(--rail-out));
  bottom:calc(var(--sa-b) + 116px)}
#aimpad.on{border-color:var(--rust);
  background:radial-gradient(circle at 50% 50%,rgba(60,24,12,.6),rgba(8,11,14,.7))}
#aimpad.on i{background:rgba(210,86,42,.4);border-color:var(--rust)}
@media (pointer:coarse){.pad{display:grid}}


/* ============================ base mode ================================== *
   Explore keeps the thin HUD, because there the world is the game. Base is a
   planning screen, so it is the one place a dense panel earns its room: a
   tool rail down the left and the catalogue along the bottom.
   ========================================================================= */
/* Indoors there is no compound to look at and no map to read: the room is
   the whole of it. */
body.indoors #mmwrap,
body.indoors #quests,
body.indoors #recenter,
body.indoors #worldChip{display:none}

body.basemode #aimpad,
body.basemode #movepad,
body.basemode #quests,
body.basemode #recenter{display:none}
body.basemode #scene{cursor:grab}

#baseui{position:absolute;inset:0;z-index:7;pointer-events:none}
#baseui.gone{display:none}
#baseui > *{pointer-events:auto}

#toolrail{position:absolute;left:calc(var(--sa-l) + 12px);
  top:calc(var(--sa-t) + 50%);transform:translateY(-58%);
  display:flex;flex-direction:column;gap:6px}
.tool-btn{width:66px;min-height:62px;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  background:linear-gradient(180deg,rgba(12,16,20,.9),rgba(6,9,12,.92));
  border:1px solid var(--line);color:var(--smoke);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(0,0,0,.5);transition:border-color .15s,color .15s}
.tool-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tool-btn span{font-family:var(--f-disp);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:600}
.tool-btn:hover{color:var(--bone);border-color:rgba(228,224,214,.3)}
.tool-btn.on{color:var(--amber);border-color:rgba(227,166,63,.55);
  background:linear-gradient(180deg,rgba(40,30,12,.92),rgba(12,10,6,.94))}

/* A strip along the bottom, and as little of one as it can be.

   It used to be a 300px panel with 112px cards and a 250px detail column
   beside them - half the screen, to pick one of forty things. The whole
   point of building is watching the compound, so the dock is now one bar
   of tabs, one row of small cards, and a single line saying what the
   selected blueprint does. The compound keeps the rest. */
#basedock{position:absolute;left:0;right:0;bottom:0;
  padding:0 calc(var(--sa-r) + var(--rail-w) + 22px) calc(var(--sa-b) + 10px)
          calc(var(--sa-l) + 88px);
  display:flex;flex-direction:column}
.bdhead{display:flex;align-items:center;gap:8px;
  padding:5px 9px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;
  background:linear-gradient(180deg,rgba(14,18,22,.94),rgba(10,13,17,.94));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.bdtabs{display:flex;gap:2px;overflow-x:auto;overscroll-behavior:contain;
  scrollbar-width:none;flex:1;min-width:0}
.bdtabs::-webkit-scrollbar{display:none}
.bdtab{flex:0 0 auto;display:flex;align-items:center;gap:5px;
  padding:4px 9px;border:1px solid transparent;border-radius:7px;
  color:var(--smoke);font-family:var(--f-disp);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;font-weight:600;white-space:nowrap;min-height:26px;
  transition:color .13s,background .13s,border-color .13s}
.bdtab svg{width:13px;height:13px;fill:currentColor;flex:none;opacity:.85}
.bdtab:hover{color:var(--bone);background:rgba(228,224,214,.05)}
.bdtab.on{background:rgba(227,166,63,.13);color:var(--amber);
  border-color:rgba(227,166,63,.45)}
.bdtab.on svg{opacity:1}
.bdsum{display:flex;gap:12px;font-family:var(--f-mono);font-size:11px;color:var(--dim);
  white-space:nowrap}
.bdsum b{color:var(--bone);font-weight:500}
.bdsum s{text-decoration:none;color:var(--rust)}
#bdExit{padding:6px 14px;border:1px solid var(--line);border-radius:9px;
  font-family:var(--f-disp);font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--bone);min-height:32px}
#bdExit:hover{border-color:var(--bone);background:rgba(228,224,214,.06)}

.bdbody{display:flex;flex:none;
  border:1px solid var(--line);border-bottom:0;
  background:linear-gradient(180deg,rgba(12,16,20,.94),rgba(8,11,14,.96));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 -8px 30px rgba(0,0,0,.5)}

/* One line under the strip: what the selected blueprint is and does. It
   replaces a 250px column that repeated the card you were already on. */
.bdfoot{display:flex;align-items:center;gap:9px;min-height:30px;
  padding:5px 11px;border:1px solid var(--line);border-radius:0 0 12px 12px;
  background:linear-gradient(180deg,rgba(9,12,15,.95),rgba(7,9,12,.97));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-size:11.5px;color:var(--smoke);white-space:nowrap;overflow:hidden}
.bdfoot b{font-family:var(--f-disp);font-weight:700;font-size:12px;letter-spacing:.05em;
  color:var(--bone);flex:none}
.bdfoot i{font-style:normal;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bdfoot .fcost{display:flex;gap:8px;font-family:var(--f-mono);font-size:10.5px;flex:none}
.bdfoot .fcost s{text-decoration:none;display:flex;align-items:center;gap:3px;color:var(--smoke)}
.bdfoot .fcost s.no{color:var(--rust)}
.bdfoot .fcost svg.gi{width:11px;height:11px}
.bdfoot .go{color:var(--moss)}
.bdfoot .stop{color:var(--rust)}
.bdlist{flex:1;min-width:0;display:flex;align-items:flex-start;gap:5px;
  overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;
  padding:8px 10px;scrollbar-width:thin}
.bdlist::-webkit-scrollbar{height:9px}
.bdlist::-webkit-scrollbar-track{background:transparent}
.bdlist::-webkit-scrollbar-thumb{background:rgba(228,224,214,.16);
  background-clip:content-box;border:3px solid transparent;border-radius:6px}
.bdlist::-webkit-scrollbar-thumb:hover{background:rgba(228,224,214,.3);
  background-clip:content-box;border:3px solid transparent}
.bcard{position:relative;flex:0 0 auto;width:86px;height:86px;
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:radial-gradient(86% 70% at 50% 34%,rgba(228,224,214,.075),rgba(228,224,214,0) 76%),
             linear-gradient(180deg,rgba(24,30,36,.5),rgba(8,11,14,.5));
  display:flex;flex-direction:column;align-items:stretch;
  transition:border-color .15s,background .15s,transform .12s}
.bcard{background-image:linear-gradient(180deg,rgba(228,224,214,.045),rgba(228,224,214,0) 44%)}
.bcard:hover{background-color:rgba(228,224,214,.07);border-color:rgba(228,224,214,.3);
  transform:translateY(-1px)}
.bcard:active{transform:translateY(0)}
.bcard.on{border-color:var(--amber);background-color:rgba(227,166,63,.11);
  box-shadow:inset 0 0 0 1px rgba(227,166,63,.16)}
.bcard.no{opacity:.5}
.bcard.lock{opacity:.4}
/* the piece sits in the middle of its shelf, not on the floor of it */
.bcard .ba{position:absolute;inset:0;display:grid;place-items:center}
.bcard .ba::after{content:"";position:absolute;left:20%;right:20%;bottom:37%;height:7px;
  border-radius:50%;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.45),rgba(0,0,0,0) 72%)}
.bcard .ba canvas{display:block}
/* The caption floats on the render rather than sitting under it, so the
   picture gets the whole tile and the words still read. The scrim has to
   be short and soft: tall and opaque, it swallowed the building whole
   and every card in the strip came out looking blank. */
.bcard .bmeta{position:relative;margin-top:auto;z-index:1;
  display:flex;flex-direction:column;align-items:center;gap:0;
  padding:5px 4px 4px;
  background:linear-gradient(0deg,rgba(6,9,12,.93) 40%,rgba(6,9,12,.5) 76%,rgba(6,9,12,0))}
.bcard .bn{flex:none;font-family:var(--f-disp);font-size:10.5px;font-weight:600;
  line-height:1.3;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.8);
  color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78px}
/* The description moved to the line under the strip. A card this size
   has room for a picture, a name and a price, and nothing else. */
.bcard .bd{display:none}
.bcard .bc{flex:none;display:flex;gap:7px;justify-content:center;line-height:1.35;
  max-width:80px;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.bcard .bc s{text-decoration:none;font-family:var(--f-mono);font-size:10.5px;color:var(--smoke);
  display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.bcard .bc s svg.gi{width:12px;height:12px}
.bcard .bc s.no{color:var(--rust)}
.bcard .bl{flex:none;line-height:1.5;font-family:var(--f-disp);font-size:8px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim)}

/* ---- the structure panel ----

   A building is where every resource you own ends up, and until now
   deciding whether to put another two hundred scrap into one was done
   from a caption. This is the screen for that decision and it is sized
   like one: the thing itself drawn large, what it does now, what it
   would do next, exactly what that costs, and the three other things you
   might do with it instead.

   It is deliberately NOT the console. The console's section rail is for
   moving between parts of the game; this is one object, opened by
   clicking that object, and closed by finishing with it. It floats over
   the compound because the compound is the context for the decision. */
/* Anchored to the bottom, capped by what is actually above it. Capped
   at a flat figure instead, a tall structure's panel grew up through the
   top of the screen and took its own header with it. */
#bpop{position:absolute;z-index:16;width:min(430px,calc(100vw - 32px));
  max-height:calc(100dvh - var(--sa-t) - var(--sa-b) - 92px);
  left:50%;transform:translateX(-50%);bottom:calc(var(--sa-b) + 22px);
  border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(180deg,rgba(17,22,28,.985),rgba(7,10,13,.99));
  -webkit-backdrop-filter:blur(18px) saturate(.9);backdrop-filter:blur(18px) saturate(.9);
  box-shadow:0 26px 64px rgba(0,0,0,.68),inset 0 1px 0 rgba(228,224,214,.07);
  display:flex;flex-direction:column;overflow:hidden}
#bpop.gone{display:none}

/* header: the render, the name, the level track */
#bpop .ph{display:flex;align-items:stretch;gap:12px;flex:none;
  padding:12px 12px 11px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(228,224,214,.055),rgba(228,224,214,0))}
#bpop .pshot{flex:none;width:118px;height:94px;border-radius:10px;
  border:1px solid var(--line-soft);overflow:hidden;
  display:grid;place-items:center;position:relative;
  background:radial-gradient(76% 62% at 50% 34%,rgba(228,224,214,.1),rgba(0,0,0,.34) 78%)}
#bpop .pshot::after{content:"";position:absolute;left:16%;right:16%;bottom:12%;height:8px;
  border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),rgba(0,0,0,0))}
#bpop .pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;
  justify-content:center}
#bpop .pt .pcat{font-family:var(--f-disp);font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim)}
#bpop .pt h4{font-family:var(--f-disp);font-weight:700;font-size:19px;letter-spacing:.045em;
  line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bpop .pt .plv{display:flex;align-items:center;gap:7px;
  font-family:var(--f-mono);font-size:11px;color:var(--amber);letter-spacing:.06em}
#bpop .pt .plv s{text-decoration:none;color:var(--dim)}
#bpop .pips{display:flex;gap:2px;flex:1}
#bpop .pips i{flex:1;height:4px;border-radius:1px;background:rgba(228,224,214,.13)}
#bpop .pips i.on{background:var(--amber)}
#bpop .px{position:absolute;right:9px;top:9px;width:28px;height:28px;
  border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;
  color:var(--smoke);font-size:15px;line-height:1;background:rgba(6,9,12,.6);z-index:2}
#bpop .px:hover{color:var(--bone);border-color:var(--bone);background:rgba(228,224,214,.08)}

#bpop .pbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:11px 12px 12px;display:flex;flex-direction:column;gap:10px}
#bpop .pbody::-webkit-scrollbar{width:8px}
#bpop .pbody::-webkit-scrollbar-thumb{background:rgba(228,224,214,.16);
  background-clip:content-box;border:2px solid transparent;border-radius:6px}

#bpop .pblurb{font-size:12px;line-height:1.45;color:var(--smoke)}
#bpop .pbar{height:5px;border-radius:3px;background:rgba(0,0,0,.6);overflow:hidden}
#bpop .pbar i{display:block;height:100%;background:var(--moss);transform-origin:left;
  transition:transform .18s}
#bpop .slab{font-family:var(--f-disp);font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
#bpop .slab::after{content:"";flex:1;height:1px;background:var(--line)}

/* the stat table - what it does now against what it would do */
#bpop .stats{display:flex;flex-direction:column;gap:1px;
  border:1px solid var(--line);border-radius:9px;overflow:hidden}
#bpop .strow{display:grid;grid-template-columns:minmax(0,1fr) auto 12px auto;
  align-items:baseline;gap:8px;padding:6px 10px;
  background:rgba(228,224,214,.022);font-size:11.5px;color:var(--smoke)}
#bpop .strow:nth-child(even){background:rgba(228,224,214,.045)}
#bpop .strow b,#bpop .strow u{font-family:var(--f-mono);font-size:11.5px;
  font-variant-numeric:tabular-nums;text-decoration:none}
#bpop .strow b{color:var(--bone)}
#bpop .strow em{font-style:normal;color:var(--dim);text-align:center}
#bpop .strow u{color:var(--moss)}
#bpop .strow.flat u{color:var(--smoke)}

/* the cost of the next level */
#bpop .costs{display:flex;flex-wrap:wrap;gap:7px}
#bpop .costs s{text-decoration:none;display:flex;align-items:center;gap:5px;
  padding:5px 9px;border:1px solid var(--line);border-radius:8px;
  font-family:var(--f-mono);font-size:11.5px;color:var(--bone);
  background:rgba(228,224,214,.03);font-variant-numeric:tabular-nums}
#bpop .costs s.no{border-color:rgba(176,74,54,.5);color:var(--rust);
  background:rgba(176,74,54,.08)}
#bpop .costs s i{font-style:normal;color:var(--dim)}
#bpop .costs svg.gi{width:13px;height:13px}

/* the action it exists for, then the three lesser ones */
#bpop .pmain{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;min-height:46px;padding:8px 14px;border-radius:10px;
  border:1px solid rgba(138,170,110,.55);color:#DCE8CE;
  background:linear-gradient(180deg,rgba(138,170,110,.2),rgba(138,170,110,.08));
  font-family:var(--f-disp);font-size:13px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;transition:background .14s,border-color .14s,transform .1s}
#bpop .pmain:hover{background:linear-gradient(180deg,rgba(138,170,110,.3),rgba(138,170,110,.14))}
#bpop .pmain:active{transform:translateY(1px)}
#bpop .pmain.off{opacity:.45;border-color:var(--line);color:var(--smoke);
  background:rgba(228,224,214,.03)}
#bpop .pmain.done{border-color:rgba(227,166,63,.5);color:var(--amber);
  background:rgba(227,166,63,.1)}
#bpop .pmain em{font-style:normal}
#bpop .pmain span{font-family:var(--f-mono);font-size:11px;font-weight:400;
  letter-spacing:0;text-transform:none;color:var(--smoke)}
#bpop .prow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#bpop .pb{display:flex;flex-direction:column;align-items:center;gap:3px;
  min-height:44px;padding:6px 4px;border:1px solid var(--line);border-radius:9px;
  font-family:var(--f-disp);font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--smoke);
  transition:background .13s,border-color .13s,color .13s}
#bpop .pb svg{width:15px;height:15px;fill:currentColor;opacity:.85}
#bpop .pb:hover{background:rgba(228,224,214,.07);border-color:rgba(228,224,214,.34);
  color:var(--bone)}
#bpop .pb.danger:hover{border-color:rgba(176,74,54,.5);color:var(--rust);
  background:rgba(176,74,54,.1)}
#bpop .pb.off{opacity:.4}
#bpop .pnote{font-size:11.5px;color:var(--dim);text-align:center;padding:2px 0}
/* The things you came here to press never scroll.

   Everything above them can: the stat table on a turret is eight rows
   and on a wall it is one, so the panel has to give somewhere. It gives
   in the middle. Upgrade and the three lesser actions stay put, because
   a button you have to go looking for is a button that is not there. */
#bpop .pfoot{flex:none;display:flex;flex-direction:column;gap:6px;
  padding:10px 12px 12px;border-top:1px solid var(--line);
  background:linear-gradient(180deg,rgba(228,224,214,.03),rgba(228,224,214,0))}
#bpop .phold{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--smoke)}
#bpop .phold s{text-decoration:none;display:flex;align-items:center;gap:4px;
  font-family:var(--f-mono);color:var(--bone)}
#bpop .phold svg.gi{width:12px;height:12px}

/* in build mode it sits clear of the dock, and loses that much height */
body.basemode #bpop{bottom:200px;
  max-height:calc(100dvh - var(--sa-t) - 272px)}

@media (max-width:900px){
  #toolrail{left:calc(var(--sa-l) + 8px)}
  .tool-btn{width:56px;min-height:50px;gap:3px}
  .tool-btn svg{width:17px;height:17px}
  .tool-btn span{font-size:9px;letter-spacing:.1em}
  #basedock{padding-left:calc(var(--sa-l) + 74px)}
  .bdsum{display:none}
}
/* The description only leaves the line when the line genuinely cannot
   hold it. A tablet has the room, and this is now the only place the
   description lives. */
@media (max-width:560px){
  .bdfoot i{display:none}
  .bdtab span{display:none}
  .bdtab{padding:4px 8px}
  .bdtab.on span{display:inline}
}


/* The dock must never eat the compound it exists to edit. On a short
   window it loses the preview art and shrinks to a name-and-cost list. */
@media (max-height:620px){
  .bcard{width:76px;height:76px}
  .bdlist{padding:6px 9px}
  .tool-btn{width:54px;min-height:46px;gap:2px}
  body.basemode #bpop{bottom:178px}
}
@media (max-height:480px){
  .bcard{width:66px;height:66px}
  .bcard .bmeta{padding-top:6px}
  .bdfoot{display:none}
  .tool-btn{width:50px;min-height:42px}
  .tool-btn span{display:none}
  body.basemode #bpop{bottom:150px}
  #bpop{max-height:calc(100vh - 96px)}
}

/* ============================ command rail =============================== *
   Destinations live in a column down the right edge rather than a bar across
   the bottom. A bar steals a full strip of the world at its widest point; a
   rail takes a thumb's width of the side, and on a phone the right edge is
   where the thumb already is.
   ========================================================================= */
#srail{position:absolute;right:calc(var(--sa-r) + 10px);top:50%;
  transform:translateY(-50%);z-index:9;
  display:flex;flex-direction:column;gap:6px;align-items:flex-end}
/* One slab, divided, rather than six floating tiles: the rail is a piece
   of equipment bolted to the edge of the screen and it should look like
   one. The buttons keep their own hit areas and the seams between them
   are hairlines, so it still reads as six things. */
#srail{padding:5px;border-radius:15px;gap:3px;
  background:linear-gradient(180deg,rgba(16,21,27,.9),rgba(6,9,13,.93));
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px) saturate(.85);backdrop-filter:blur(14px) saturate(.85);
  box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(228,224,214,.06)}
.rbtn{position:relative;width:var(--rail-w);height:var(--rail-w);border-radius:11px;
  display:grid;place-items:center;gap:0;background:transparent;border:0;
  color:var(--smoke);transition:color .15s,background .15s,transform .1s}
/* filled facets in currentColor, so one icon reads at 25px and still
   turns amber with its button */
.rbtn svg{width:25px;height:25px;fill:currentColor;stroke:none;
  transition:transform .12s}
.rbtn:hover{color:var(--bone);background:rgba(228,224,214,.07)}
.rbtn:hover svg{transform:scale(1.06)}
.rbtn:active{transform:scale(.93)}
.rbtn.on{color:var(--amber);
  background:linear-gradient(180deg,rgba(52,38,14,.92),rgba(20,15,7,.94));
  box-shadow:inset 0 0 0 1px rgba(227,166,63,.3)}
/* the marker tells you where you are without relying on the tint alone */
.rbtn.on::after{content:"";position:absolute;left:-5px;top:12px;bottom:12px;width:2px;
  border-radius:2px;background:var(--amber);box-shadow:0 0 8px rgba(227,166,63,.6)}
.rbtn i.dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;
  background:var(--rust);display:none;box-shadow:0 0 0 2px rgba(5,7,10,.8)}
.rbtn.alert i.dot{display:block}
/* the name rides out of the button on hover instead of living under it */
.rbtn u{position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);
  text-decoration:none;white-space:nowrap;padding:4px 9px;border-radius:4px;
  background:rgba(8,11,15,.94);border:1px solid var(--line);color:var(--bone);
  font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;opacity:0;pointer-events:none;transition:opacity .13s}
.rbtn:hover u{opacity:1}
@media (pointer:coarse){.rbtn u{display:none}}

/* ============================ the rack =================================== *
   One card design for a weapon, used twice: down the left of the world so
   you can change weapon mid-fight without opening anything, and again as
   the arsenal column inside the weapon bay.

   The gun is dark gunmetal on a dark panel, so every card lights its own
   pool for the gun to sit in - without it the art reads as a smudge.
   ========================================================================= */
.gcard{position:relative;display:block;width:100%;padding:7px 9px 6px;
  border:1px solid var(--line);border-radius:5px;text-align:left;
  background:linear-gradient(180deg,rgba(25,31,38,.92),rgba(10,14,18,.94));
  transition:border-color .14s,background .14s,box-shadow .14s}
.gcard:hover{border-color:rgba(228,224,214,.28);
  background:linear-gradient(180deg,rgba(33,41,49,.95),rgba(14,19,24,.96))}
.gcard.on{border-color:rgba(227,166,63,.5);
  background:linear-gradient(180deg,rgba(45,36,18,.8),rgba(14,13,9,.95));
  box-shadow:0 3px 16px rgba(0,0,0,.42),inset 0 0 0 1px rgba(227,166,63,.1)}
/* the strip down the edge is what you actually read at a glance */
.gcard.on::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:2px;
  border-radius:2px;background:var(--amber);box-shadow:0 0 8px rgba(227,166,63,.55)}
.gcw{display:block;border-radius:4px;
  background:radial-gradient(64% 76% at 50% 46%,rgba(228,224,214,.11),rgba(228,224,214,0) 72%)}
.gcw canvas{display:block;width:100%;height:auto;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.gcm{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  margin-top:2px;padding:0 2px}
.gcm b{font-family:var(--f-disp);font-weight:700;font-size:13.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--bone);line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcm s{flex:none;text-decoration:none;font-family:var(--f-mono);font-size:10.5px;
  color:var(--smoke);font-variant-numeric:tabular-nums}
.gcard.on .gcm s{color:var(--amber)}
.gcm s.lo{color:var(--rust)}
.gcm s.rel{color:var(--amber)}
.gcard.lock .gcw canvas{opacity:.34;filter:grayscale(.7)}
.gcard.lock .gcm b{color:var(--smoke)}
.gcard.lock .gcm s{color:var(--dim)}
.gclk{position:absolute;top:7px;right:8px;display:grid;place-items:center}
.gclk svg{width:13px;height:13px;fill:var(--dim)}
.gck{position:absolute;top:6px;left:8px;font-style:normal;font-family:var(--f-mono);
  font-size:9.5px;color:var(--dim);letter-spacing:.04em}
.gcard.on .gck{color:rgba(227,166,63,.72)}

/* Down the right, under the top instruments and inboard of the command
   rail. The left column is already the survivor plate, the objectives and
   the map, stacked from top to bottom with nothing spare between them. */
/* Glass, not slab. The rack sits over the world rather than over a
   panel, so it is the one instrument that can afford to let the world
   through it - and being lighter and smaller it stops competing with the
   thing you are actually aiming at.

   It stands on top of the map, in the map's own column: the left edge is
   already a stack of things you read - who you are, what you owe, where
   you are - and what is in your hands belongs in that stack rather than
   floating on its own against the far side of the screen. */
#grack{position:absolute;left:calc(var(--sa-l) + 12px);z-index:8;
  width:var(--col);bottom:calc(var(--sa-b) + var(--mm) + 20px);
  max-height:calc(100dvh - var(--sa-t) - var(--sa-b)
                  - var(--hud-h) - var(--mm) - 54px);
  display:flex;flex-direction:column;border-radius:12px;padding:6px 6px 7px;
  /* a thin dark floor under the white, so what is on the glass keeps its
     contrast when the glass happens to be over a sunlit field */
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),
             rgba(11,15,20,.14);
  border:1px solid rgba(255,255,255,.17);
  -webkit-backdrop-filter:blur(13px) saturate(1.08);
  backdrop-filter:blur(13px) saturate(1.08);
  box-shadow:0 10px 26px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.22)}
#grack .grl{gap:4px}
/* the cards are panes in the same glass */
#grack .gcard{padding:3px 4px;border-radius:7px;
  border-color:rgba(255,255,255,.11);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
#grack .gcard:hover{border-color:rgba(255,255,255,.34);
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07))}
#grack .gcard.on{border-color:rgba(255,255,255,.82);
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.10));
  box-shadow:0 3px 12px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.42)}
#grack .gcard.on::before{background:#FFF;box-shadow:0 0 9px rgba(255,255,255,.85);
  top:6px;bottom:6px}
#grack .gcw{background:radial-gradient(64% 76% at 50% 46%,rgba(255,255,255,.2),
  rgba(255,255,255,0) 72%)}
#grack .gcw canvas{filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
/* the only text on the rack, in the corner of the one you are holding */
.gcammo{position:absolute;right:6px;bottom:3px;text-decoration:none;
  font-family:var(--f-mono);font-size:9px;color:#FFF;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;pointer-events:none;
  text-shadow:0 1px 4px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.7)}
.gcammo:empty{display:none}
.gcammo.lo{color:#FFB39A}
.gcammo.rel{color:#FFD98A}
/* a thumb needs that corner for the move pad, so on touch the rack
   stands on top of the pad rather than under it */
@media (pointer:coarse){
  #grack{bottom:calc(var(--sa-b) + var(--mm) + 146px);
    max-height:calc(100dvh - var(--sa-t) - var(--sa-b)
                    - var(--hud-h) - var(--mm) - 176px)}
}
body.basemode #grack{display:none}
.grl{display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:none}
.grl::-webkit-scrollbar{display:none}

/* Below this the rack is more screen than the world can spare, so it goes
   and the survivor plate at the top keeps the round count. */
@media (max-width:820px),(max-height:560px){
  #grack{display:none}
}

/* ============================ minimap ==================================== */
#mmwrap{position:absolute;left:calc(var(--sa-l) + 12px);bottom:calc(var(--sa-b) + 12px);
  z-index:8;border-radius:12px;overflow:hidden;width:var(--col);height:var(--col)}
body.basemode #mmwrap{display:none}
#mmCv{display:block;width:100%;height:100%;cursor:pointer}
#mmwrap .mmN{position:absolute;top:5px;left:50%;transform:translateX(-50%);
  font-family:var(--f-disp);font-size:10px;letter-spacing:.18em;color:var(--smoke);
  pointer-events:none}
#mmwrap .mmring{position:absolute;inset:0;pointer-events:none;border-radius:12px;
  box-shadow:inset 0 0 22px rgba(0,0,0,.65)}
#mmwrap .mmexp{position:absolute;right:5px;bottom:4px;font-family:var(--f-mono);
  font-size:9px;color:var(--dim);pointer-events:none}

@media (max-width:640px){
  :root{--rail-w:48px;--mm:104px;--col:152px}
  .rbtn svg{width:20px;height:20px}
}
@media (max-height:620px){
  #srail{gap:4px}
}
@media (max-height:620px){
  :root{--col:164px}
}
@media (max-height:520px){
  :root{--mm:92px;--col:148px}
}

/* ---- the haul, in transit ---- */
/* The haul, in transit.

   Only transform and opacity move here, so the whole thing runs on the
   compositor and never asks the page to lay out again - which is what
   makes a hundred marks crossing a phone screen free rather than a
   stutter. The transition timings are set from script per mark, so a
   flight can be faster for a small pickup and longer for a big one. */
#flyers{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden;
  contain:layout style}
.flyer{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.flyi{position:absolute;left:-10px;top:-10px;display:grid;place-items:center;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.65));will-change:transform,opacity}
.flyi svg{display:block}

/* the ring where it came out of the ground */
.fring{position:absolute;left:0;top:0;width:0;height:0;
  border-radius:50%;
  box-shadow:0 0 0 2px var(--rc);
  opacity:.85;
  animation:fring .48s cubic-bezier(.2,.7,.4,1) forwards}
.fring.big{animation-duration:.6s;box-shadow:0 0 0 3px var(--rc)}
@keyframes fring{
  from{width:6px;height:4px;margin:-2px 0 0 -3px;opacity:.9}
  to{width:78px;height:50px;margin:-25px 0 0 -39px;opacity:0}
}
/* chips thrown out of it */
.fbit{position:absolute;left:0;top:0;width:4px;height:4px;border-radius:1px;
  margin:-2px 0 0 -2px;opacity:0;
  animation:fbit .46s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fbit{
  0%{transform:translate(0,0) scale(1);opacity:.95}
  70%{opacity:.8}
  100%{transform:translate(var(--bx),var(--by)) scale(.3);opacity:0}
}
/* the figure, for a haul worth naming */
.ftag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;
  transform:translate(-50%,-50%);white-space:nowrap;
  padding:3px 9px 4px;border-radius:9px;
  border:1px solid var(--rc);
  background:linear-gradient(180deg,rgba(12,16,20,.94),rgba(6,9,12,.96));
  box-shadow:0 6px 18px rgba(0,0,0,.6);
  animation:ftag .96s cubic-bezier(.2,.8,.3,1) forwards}
.ftag b{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--rc);
  font-variant-numeric:tabular-nums}
.ftag svg.gi{width:14px;height:14px}
@keyframes ftag{
  0%{transform:translate(-50%,-50%) scale(.5);opacity:0}
  16%{transform:translate(-50%,-56%) scale(1.12);opacity:1}
  30%{transform:translate(-50%,-58%) scale(1);opacity:1}
  72%{opacity:1}
  100%{transform:translate(-50%,-136%) scale(.94);opacity:0}
}
@media (prefers-reduced-motion:reduce){
  #flyers{display:none}
}
}


/* ======================================================================
   The rebuilt HUD, over the top of what came before.

   Written as an overlay rather than a rewrite: everything below this
   line restates only the pieces that changed shape, and the cascade
   does the rest. The build dock, the structure panel, the weapon rack
   and the flying pickups are all still described above and still work.
   ====================================================================== */

/* ============================ HUD =======================================
   One surface, one accent, four corners.

   Every panel is the same cold slate card with the same hairline and the
   same radius, and everything live on any of them is one blue. That is
   what makes a HUD read as a single instrument rather than a pile of
   widgets: the blue on the active tab, on the selected weapon, on the
   fire ring and on the experience bar all mean "this part is yours".

   The corners have jobs. Top left is you - who you are, what you are
   holding, what you have been asked to do. Top middle is the clock and
   what it is bringing. Top right is what you own. Bottom left is what
   you can reach for. Bottom right is what your thumb does. The bar along
   the bottom is where everything else lives.
   ========================================================================= */
#hud{
  position:absolute;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding:calc(var(--sa-t) + 10px) calc(var(--sa-r) + 12px) 0 calc(var(--sa-l) + 12px);
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  gap:10px;align-items:start;
}
#hud button,#hud .card,#hud .res{pointer-events:auto}

/* the one card every cluster is cut from */
.card{
  position:relative;
  background:linear-gradient(180deg,rgba(24,36,48,.92),rgba(10,16,23,.94));
  border:1px solid var(--hud-line);border-radius:10px;
  -webkit-backdrop-filter:blur(14px) saturate(1.05);backdrop-filter:blur(14px) saturate(1.05);
  box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(160,200,232,.09);
}
.inst{
  background:linear-gradient(180deg,rgba(24,36,48,.92),rgba(10,16,23,.94));
  border:1px solid var(--hud-line);
  -webkit-backdrop-filter:blur(14px) saturate(1.05);backdrop-filter:blur(14px) saturate(1.05);
  box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(160,200,232,.09);
}

.hcol.l{display:flex;flex-direction:column;gap:6px;min-width:0;width:var(--col);
  height:auto;max-height:none}
.hmid{display:flex;flex-direction:column;align-items:center;gap:6px;justify-self:center}
.rcol{display:flex;justify-content:flex-end;align-items:flex-start;min-width:0}

/* ---- the survivor ---- */
/* Portrait, level, bars - three columns, no absolute positioning.

   Hanging the level chip off the card's corner and then pushing the bars
   past it with a margin looked fine until the card had to hold two bars
   instead of one, at which point the bars were 64px wide and unreadable.
   A grid cannot collide with itself. */
#sv{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;
  align-items:center;padding:7px 9px 7px 7px;text-align:left;width:100%}
#sv:active{transform:translateY(1px)}
.svmark{position:relative;width:46px;height:46px;flex:none;border-radius:8px;
  overflow:hidden;background:linear-gradient(165deg,#25384A,#0F1822);
  border:1px solid rgba(160,200,232,.28)}
#svFace{position:absolute;inset:0;width:100%;height:100%;display:block}
/* the level, in its own chip beside the portrait the way the reference has it */
.svlvl{position:relative;flex:none;
  min-width:30px;height:30px;padding:0 5px;border-radius:7px;
  display:grid;place-items:center;
  font-family:var(--f-disp);font-weight:700;font-size:17px;line-height:1;
  color:#EAF4FF;background:linear-gradient(180deg,#2E6FA8,#1B4468);
  border:1px solid rgba(126,190,240,.5);
  box-shadow:0 2px 6px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.svcol{display:flex;flex-direction:column;gap:5px;min-width:0}

/* a labelled bar: tag, track, figure - used for health and experience */
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px}
.bar s{text-decoration:none;font-family:var(--f-disp);font-size:9px;font-weight:700;
  letter-spacing:.12em;color:var(--smoke);width:16px}
.btrack{position:relative;height:11px;border-radius:5px;overflow:hidden;
  background:rgba(4,8,12,.72);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.btrack>i{position:absolute;inset:0;transform-origin:left;border-radius:5px;
  transition:transform .16s linear,background .3s}
.bar.hp .btrack>i{background:linear-gradient(180deg,#7BD877,var(--hp))}
.bar.xp .btrack>i{background:linear-gradient(180deg,#63BAF2,var(--xp))}
.bar u{text-decoration:none;font-family:var(--f-mono);font-size:10.5px;color:#D6E4F0;
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- the weapon in your hands ---- */
#wpnCard{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
  padding:7px 10px 7px 7px;width:100%;text-align:left}
.wpic{width:62px;height:34px;flex:none;border-radius:7px;display:grid;place-items:center;
  background:rgba(4,10,16,.5);border:1px solid var(--hud-line2);overflow:hidden}
#wpnArt{width:58px;height:28px;display:block}
.wcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.wname{font-family:var(--f-disp);font-size:13px;font-weight:700;letter-spacing:.04em;
  color:#E8F1F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar{height:4px;border-radius:3px;background:rgba(4,8,12,.72);overflow:hidden}
.wbar>i{display:block;height:100%;transform-origin:left;
  background:linear-gradient(90deg,#4EA8E8,#7ECBFF);transition:transform .14s linear}
.wammo{display:flex;align-items:center;gap:5px;flex:none}
.wammo svg{width:13px;height:13px;fill:var(--smoke)}
.wammo b{font-family:var(--f-mono);font-size:13px;color:#E8F1F8;
  font-variant-numeric:tabular-nums}

/* ---- the clock, and what it is bringing ---- */
#worldChip{display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:9px}
#wcOrb{width:16px;height:16px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 34% 30%,#FFE7A8,#E0A33C);
  box-shadow:0 0 10px rgba(227,166,63,.45)}
.wctext{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
#wcDay{font-family:var(--f-disp);font-weight:700;font-size:16px;letter-spacing:.07em;
  text-transform:uppercase;color:#EAF2F8}
#wcTime{font-family:var(--f-mono);font-size:14px;color:#C4D4E2;
  font-variant-numeric:tabular-nums}
#wcPhase{font-family:var(--f-disp);font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim)}
#wcZone{font-family:var(--f-disp);font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--smoke);padding-left:9px;
  border-left:1px solid var(--hud-line2)}
#wcZone.hot{color:#E8734A}
/* the wave counter, in its own chip under the clock */
#threat{display:none;align-items:center;gap:8px;padding:5px 13px;border-radius:9px}
#threat.on{display:flex}
#threat .dot{width:15px;height:15px;flex:none;
  -webkit-mask:var(--skull) center/contain no-repeat;mask:var(--skull) center/contain no-repeat;
  background:#E2553C}
#threatN{font-family:var(--f-disp);font-size:13px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:#F0D7CE;white-space:nowrap}
#threat.hot{border-color:rgba(226,85,60,.55);background:linear-gradient(180deg,rgba(60,22,16,.94),rgba(24,10,8,.95))}
#threat.hot .dot{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ---- what you own ---- */
#resRow{display:flex;align-items:stretch;gap:6px;max-width:100%;
  overflow-x:auto;overscroll-behavior:contain;scrollbar-width:none}
#resRow::-webkit-scrollbar{display:none}
/* Each one is a chip with a plus on the end, because "where do I get
   more of this" is the only question a resource number ever prompts. */
#resRow .res{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:5px 5px 5px 9px;border-radius:9px;text-align:left;
  background:linear-gradient(180deg,rgba(24,36,48,.92),rgba(10,16,23,.94));
  border:1px solid var(--hud-line);
  box-shadow:0 5px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(160,200,232,.08);
  transition:border-color .13s}
#resRow .res:hover{border-color:rgba(126,190,240,.42)}
#resRow .res .rmk{width:20px;height:20px;flex:none;display:grid;place-items:center}
#resRow .res .rmk svg.gi{width:18px;height:18px;opacity:1}
#resRow .res .rtx{display:flex;align-items:baseline;gap:0;min-width:0}
#resRow .res .rtx s{display:none}
#resRow .res b{font-family:var(--f-mono);font-size:14px;font-weight:500;
  font-variant-numeric:tabular-nums;color:#E8F1F8;letter-spacing:-.01em}
#resRow .res .rplus{width:22px;height:22px;flex:none;border-radius:6px;
  display:grid;place-items:center;
  background:rgba(78,168,232,.16);border:1px solid rgba(126,190,240,.34)}
#resRow .res .rplus svg{width:11px;height:11px;fill:#8FD0FF}
#resRow .res:active .rplus{background:rgba(78,168,232,.3)}
#resRow .res .rfill{position:absolute;left:9px;right:33px;bottom:2px;height:2px;
  border-radius:2px;background:rgba(0,0,0,.45);pointer-events:none}
#resRow .res .rfill i{display:block;height:100%;border-radius:2px;
  transform:scaleX(0);transform-origin:left;background:var(--hp);transition:transform .3s}
#resRow .res.nocap .rfill{display:none}
#resRow .res.full .rfill i{background:var(--amber)}
#resRow .res.bad b{color:#E8734A}
#resRow .more{padding:5px 11px;color:var(--smoke);font-size:15px;line-height:1;
  border-radius:9px;
  background:linear-gradient(180deg,rgba(24,36,48,.92),rgba(10,16,23,.94));
  border:1px solid var(--hud-line)}
#resRow .res.pop{animation:resPop .5s cubic-bezier(.2,.9,.3,1)}
#resRow .res.pop .rmk{animation:markPop .5s cubic-bezier(.2,.9,.3,1)}
@keyframes resPop{0%{transform:scale(1)}30%{transform:scale(1.11)}100%{transform:scale(1)}}
@keyframes markPop{0%{transform:scale(1)}30%{transform:scale(1.28) rotate(-7deg)}100%{transform:scale(1)}}

/* ---- what you have been asked to do ----
   In the column now, not floating under it. The old rule pinned this
   absolutely below the survivor card, which stacked it straight on top
   of the weapon card the moment there were three cards instead of two. */
#quests{position:static;left:auto;top:auto;right:auto;bottom:auto;
  width:100%;max-width:none;z-index:auto;
  display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.quest{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
  padding:8px 9px 8px 8px;border-radius:10px;text-align:left;width:100%;
  background:linear-gradient(180deg,rgba(24,36,48,.92),rgba(10,16,23,.94));
  border:1px solid var(--hud-line);
  box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(160,200,232,.08)}
.quest .qmk{width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;
  background:rgba(227,166,63,.16);border:1px solid rgba(240,188,88,.4)}
.quest .qmk svg{width:15px;height:15px;fill:var(--amber)}
.quest .qtx{min-width:0;display:flex;flex-direction:column;gap:2px}
.quest .qn{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:#E8F1F8;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.quest .qd{font-size:10.5px;color:var(--smoke);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.quest .qrow{display:flex;align-items:center;gap:6px}
.quest .qnum{font-family:var(--f-mono);font-size:9.5px;color:var(--dim)}
.quest .qbar{flex:1;height:3px;border-radius:2px;background:rgba(4,8,12,.7);overflow:hidden}
.quest .qbar>i{display:block;height:100%;transform-origin:left;background:var(--blue)}
.quest .qgo{width:16px;height:16px;flex:none;fill:var(--dim)}
.quest.done .qmk{background:rgba(95,196,90,.16);border-color:rgba(95,196,90,.42)}
.quest.done .qmk svg{fill:var(--hp)}


/* ---- the bar along the bottom ----

   The destinations used to be a column of five down the right edge. A
   bar is better for this game for two reasons: there are eight places to
   go rather than five, and the bottom of a screen is where a thumb rests
   on a phone. The active tab is marked at the top edge rather than by
   colouring the whole cell, so the bar stays quiet while still telling
   you where you are. */
#navbar{position:absolute;left:0;right:0;bottom:0;z-index:12;
  display:flex;align-items:stretch;
  padding:0 var(--sa-r) var(--sa-b) var(--sa-l);
  height:calc(var(--navh) + var(--sa-b));
  background:linear-gradient(180deg,rgba(16,25,34,.97),rgba(7,11,16,.99));
  border-top:1px solid var(--hud-line);
  box-shadow:0 -10px 30px rgba(0,0,0,.55)}
.nbtn{position:relative;flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:6px 2px 7px;color:var(--smoke);
  transition:color .14s,background .14s}
.nbtn svg{width:23px;height:23px;fill:currentColor;flex:none;
  transition:transform .14s,filter .14s}
.nbtn u{text-decoration:none;font-family:var(--f-disp);font-size:9.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nbtn::before{content:"";position:absolute;left:18%;right:18%;top:0;height:2px;
  border-radius:0 0 3px 3px;background:var(--blue);
  transform:scaleX(0);transform-origin:center;transition:transform .18s}
.nbtn:hover{color:#C6DCEC;background:rgba(126,190,240,.05)}
.nbtn.on{color:#8FD0FF;background:linear-gradient(180deg,rgba(78,168,232,.16),rgba(78,168,232,.02))}
.nbtn.on::before{transform:scaleX(1)}
.nbtn.on svg{filter:drop-shadow(0 0 7px var(--blue-glow))}
.nbtn:active svg{transform:translateY(1px) scale(.94)}
/* something needs your attention behind this tab */
.nbtn .nbadge{position:absolute;top:5px;right:calc(50% - 22px);
  min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  display:none;place-items:center;
  font-family:var(--f-mono);font-size:9.5px;line-height:1;color:#FFF3EE;
  background:#D2562A;border:1px solid rgba(255,180,150,.45);
  box-shadow:0 2px 6px rgba(0,0,0,.5)}
.nbtn.alert .nbadge{display:grid}
body.indoors #navbar{display:none}

/* everything anchored to the bottom now clears the bar */
:root{--navh:62px}
#gearcol{position:absolute;left:calc(var(--sa-l) + 12px);
  bottom:calc(var(--sa-b) + var(--navh) + 12px);z-index:6;
  display:flex;flex-direction:column;gap:8px;pointer-events:none}
#gearcol > *{pointer-events:auto}
.mmrow{display:flex;align-items:flex-end;gap:8px}

#grack{width:var(--col);padding:6px;border-radius:12px;
  background:linear-gradient(180deg,rgba(24,36,48,.9),rgba(10,16,23,.93));
  border:1px solid var(--hud-line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
#grack .grl{display:flex;flex-direction:column;gap:6px;max-height:none;overflow:visible}
#mmwrap{position:relative;width:132px;height:132px;padding:5px;border-radius:12px;
  background:linear-gradient(180deg,rgba(24,36,48,.9),rgba(10,16,23,.93));
  border:1px solid var(--hud-line);
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
#mmCv{width:100%;height:100%;display:block;border-radius:8px;
  background:#070B10;image-rendering:auto}

/* ---- what you can reach for ---- */
#useCol{display:flex;flex-direction:column;gap:8px}
.usebtn{position:relative;width:46px;height:46px;border-radius:10px;
  display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(28,42,56,.92),rgba(10,16,23,.94));
  border:1px solid var(--hud-line);
  box-shadow:0 6px 16px rgba(0,0,0,.48),inset 0 1px 0 rgba(160,200,232,.08);
  color:#B9D3E6;transition:border-color .14s,transform .08s,color .14s}
.usebtn svg{width:25px;height:25px;fill:currentColor}
.usebtn b{position:absolute;right:-4px;bottom:-4px;
  min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  display:grid;place-items:center;
  font-family:var(--f-mono);font-size:10.5px;line-height:1;color:#E8F1F8;
  background:linear-gradient(180deg,#2E6FA8,#173A58);
  border:1px solid rgba(126,190,240,.45);font-variant-numeric:tabular-nums}
.usebtn:hover{border-color:rgba(126,190,240,.45);color:#E8F4FF}
.usebtn:active{transform:translateY(1px)}
.usebtn.off{opacity:.42}

/* ---- what your thumb does ---- */
#acts{position:absolute;right:calc(var(--sa-r) + 14px);
  bottom:calc(var(--sa-b) + var(--navh) + 14px);z-index:6;
  display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.arow{display:flex;align-items:flex-end;gap:10px;pointer-events:none}
.arow > *{pointer-events:auto}

/* the ability discs - a ring that fills as the cooldown burns off */
.act{position:relative;display:grid;place-items:center;border:0;padding:0;
  border-radius:50%;color:#B9D3E6;
  transition:transform .08s,box-shadow .16s,color .16s}
.act.sm{width:58px;height:58px;
  background:
    conic-gradient(from -90deg,var(--ac,#4EA8E8) var(--cd,0deg),rgba(126,164,196,.14) 0)
    border-box,
    linear-gradient(180deg,rgba(26,40,54,.96),rgba(9,14,20,.97)) padding-box;
  border:3px solid transparent;
  box-shadow:0 6px 18px rgba(0,0,0,.5)}
.act.sm svg{width:26px;height:26px;fill:currentColor;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.act .akey{position:absolute;top:-4px;left:-4px;font-style:normal;
  min-width:18px;height:18px;padding:0 4px;border-radius:6px;
  display:grid;place-items:center;
  font-family:var(--f-mono);font-size:10px;line-height:1;color:#CFE2F0;
  background:#14202C;border:1px solid var(--hud-line)}
.act .acd{position:absolute;inset:0;display:none;place-items:center;
  text-decoration:none;font-family:var(--f-mono);font-size:15px;color:#EAF4FF;
  background:rgba(6,11,16,.6);border-radius:50%;
  text-shadow:0 1px 3px rgba(0,0,0,.85);font-variant-numeric:tabular-nums}
.act.ready{--ac:#4EA8E8;color:#8FD0FF;
  box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 16px var(--blue-glow)}
.act.cooling{--ac:#43566A;color:rgba(185,211,230,.4)}
.act.cooling .acd{display:grid}
.act.cooling .akey{opacity:.4}
.act.armed{--ac:#E2553C;color:#FFC49E;
  box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 20px rgba(226,85,60,.45)}
.act.armed svg{animation:actArm .66s ease-in-out infinite}
@keyframes actArm{50%{transform:scale(1.12)}}
.act:active{transform:translateY(2px) scale(.96)}
/* the sweep when it comes back */
.act .asweep{position:absolute;inset:0;border-radius:50%;pointer-events:none;overflow:hidden}
.act.charge .asweep::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle,rgba(180,226,255,.7),rgba(180,226,255,0) 70%);
  animation:actPulse .45s ease-out}
@keyframes actPulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}

/* AUTO - a toggle, not a cooldown */
.act.auto{width:62px;height:62px;flex-direction:column;gap:1px;
  background:linear-gradient(180deg,rgba(26,40,54,.96),rgba(9,14,20,.97));
  border:2px solid var(--hud-line);
  box-shadow:0 6px 18px rgba(0,0,0,.5)}
.act.auto svg{width:23px;height:23px;fill:currentColor}
.act.auto b{font-family:var(--f-disp);font-size:8.5px;font-weight:700;letter-spacing:.16em;
  color:inherit;opacity:.85}
.act.auto.on{border-color:var(--blue);color:#8FD0FF;
  box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 16px var(--blue-glow)}

/* the trigger */
.act.fire{width:96px;height:96px;
  background:
    radial-gradient(60% 60% at 50% 34%,rgba(78,168,232,.18),rgba(78,168,232,0) 72%),
    linear-gradient(180deg,rgba(26,42,58,.96),rgba(9,14,20,.97));
  border:3px solid rgba(78,168,232,.5);color:#9FD8FF;
  box-shadow:0 10px 28px rgba(0,0,0,.58),0 0 22px rgba(78,168,232,.2),
             inset 0 2px 0 rgba(160,210,245,.14)}
.act.fire svg{width:40px;height:40px;fill:currentColor;transform:rotate(-45deg);
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.act.fire .fring{position:absolute;inset:-7px;border-radius:50%;pointer-events:none;
  border:2px solid rgba(78,168,232,.26)}
.act.fire:hover{border-color:rgba(126,200,255,.7)}
.act.fire:active,.act.fire.on{border-color:#8FD0FF;color:#E6F5FF;
  box-shadow:0 6px 18px rgba(0,0,0,.6),0 0 30px rgba(78,168,232,.45)}
.act.fire.on .fring{animation:fireRing .5s linear infinite}
@keyframes fireRing{
  from{transform:scale(1);opacity:.7}
  to{transform:scale(1.16);opacity:0}
}

body.basemode #acts,body.indoors #acts,
body.basemode #gearcol,body.indoors #gearcol{display:none}

/* the pads move up off the bar */
#movepad{left:calc(var(--sa-l) + 18px);
  bottom:calc(var(--sa-b) + var(--navh) + 168px)}
#aimpad{right:calc(var(--sa-r) + 18px);
  bottom:calc(var(--sa-b) + var(--navh) + 128px)}
#basedock{padding-bottom:calc(var(--sa-b) + var(--navh) + 10px)}
body.basemode #bpop{bottom:calc(var(--navh) + 204px)}
#bpop{bottom:calc(var(--sa-b) + var(--navh) + 18px)}
#recenter{bottom:calc(var(--sa-b) + var(--navh) + 12px)}
#toolrail{bottom:auto}

@media (max-width:900px){
  :root{--navh:60px}
  .nbtn svg{width:21px;height:21px}
  .nbtn u{font-size:8.5px;letter-spacing:.09em}
  #grack{width:180px}
  #mmwrap{width:112px;height:112px}
  .act.fire{width:88px;height:88px}
  .act.fire svg{width:36px;height:36px}
}
@media (max-width:560px){
  :root{--navh:56px;--col:196px}
  /* On a phone the card cannot hold a bar AND its figures, and a bar
     squeezed to nothing is a green dot that says less than no bar at
     all. The bar survives; the numbers go. */
  .bar u{display:none}
  .bar{grid-template-columns:auto minmax(0,1fr)}
  .btrack{height:10px}
  .nbtn{gap:3px}
  .nbtn svg{width:20px;height:20px}
  .nbtn u{font-size:0;letter-spacing:0}
  .nbtn.on u{font-size:8px;letter-spacing:.08em}
  #grack{width:142px;padding:5px}
  #mmwrap{width:96px;height:96px}
  .usebtn{width:42px;height:42px}
  .act.sm{width:52px;height:52px}
  .act.auto{width:56px;height:56px}
  .act.fire{width:80px;height:80px}
  .act.fire svg{width:32px;height:32px}
}

/* ==================== buttons, second pass ==============================
   Layered after the block above rather than replacing it, so the cascade
   settles the overlaps and nothing that already worked is at risk.

   Two things here are repairs, not polish. The discs draw their cooldown
   as a conic sweep reading `--cd`, and nothing ever wrote that variable -
   the ring has been sitting empty through every cooldown the game has
   run. And the countdown was an overlay at `inset:0`, 52 pixels of dark
   disc over a 58 pixel button, so a cooling ability lost its icon
   entirely and you could not tell dash from grenade while you waited for
   either. The rest is making a press feel like a press.
   ======================================================================= */

/* ---- the bar along the bottom ---- */
.nbtn{gap:3px;padding:5px 2px 6px;
  -webkit-tap-highlight-color:transparent;
  transition:color .16s}
.nbtn .nico{position:relative;display:grid;place-items:center;
  width:46px;height:30px;border-radius:11px;
  transition:transform .22s cubic-bezier(.34,1.4,.5,1)}
/* the pill behind the active tab, grown from nothing rather than shown */
.nbtn .nico::before{content:"";position:absolute;inset:0;border-radius:11px;
  background:linear-gradient(180deg,rgba(78,168,232,.26),rgba(78,168,232,.07));
  box-shadow:inset 0 1px 0 rgba(180,224,255,.22);
  transform:scale(.55);opacity:0;
  transition:transform .24s cubic-bezier(.34,1.4,.5,1),opacity .18s}
.nbtn.on .nico::before{transform:scale(1);opacity:1}
.nbtn.on .nico{transform:translateY(-3px)}
.nbtn.on svg{filter:drop-shadow(0 2px 6px var(--blue-glow))}
.nbtn.on u{color:#9FD8FF}
/* the old full-width tint fought the pill for the eye; the pill wins */
.nbtn.on{background:none}
